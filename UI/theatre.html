<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Search Theatres</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>

    body{
      margin:0;
      font-family:'Poppins',sans-serif;
      background:#0f1014;
      color:white;
    }

    /* NAV */
    .navbar{
      padding:20px 40px;
      background:#12141b;
      display:flex;
      justify-content:space-between;
      align-items:center;
      position:sticky;
      top:0;
    }

    .logo{
      color:#f84464;
      font-size:24px;
      font-weight:700;
      cursor:pointer;
    }

    .search-box{
      width:300px;
      padding:12px;
      border:none;
      outline:none;
      border-radius:10px;
      background:#1b1f29;
      color:white;
    }

    /* SECTION */
    .container{
      padding:40px;
    }

    .title{
      font-size:28px;
      margin-bottom:20px;
    }

    /* THEATRE CARDS */
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:20px;
    }

    .card{
      background:#171b24;
      padding:20px;
      border-radius:14px;
      transition:0.3s;
      cursor:pointer;
      border:1px solid rgba(255,255,255,0.05);
    }

    .card:hover{
      transform:translateY(-5px);
      box-shadow:0 10px 25px rgba(248,68,100,0.2);
    }

    .name{
      font-size:20px;
      font-weight:600;
      margin-bottom:8px;
    }

    .address{
      font-size:14px;
      color:#aaa;
    }

    .city{
      margin-top:10px;
      font-size:13px;
      color:#f84464;
    }

  </style>
</head>

<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="logo" onclick="goHome()">BookMyShow</div>

    <input
      type="text"
      class="search-box"
      placeholder="Search theatres..."
      id="searchInput"
      onkeyup="searchTheatres()"
    />
  </div>

  <!-- CONTENT -->
  <div class="container">
    <div class="title">Discover Theatres</div>
    <div class="grid" id="theatreGrid"></div>
  </div>

  <script>

    const grid = document.getElementById("theatreGrid");

    let allTheatres = [];

    /* FETCH THEATRES */
    async function fetchTheatres(){
      try{
        const res = await fetch("http://localhost:8080/api/theatres");
        allTheatres = await res.json();
        render(allTheatres);
      }catch(err){
        console.error(err);
      }
    }

    /* RENDER */
    function render(data){
      grid.innerHTML = "";

      if(data.length === 0){
        grid.innerHTML = "<p>No theatres found 😢</p>";
        return;
      }

      data.forEach(t => {
        grid.innerHTML += `
          <div class="card" onclick="openScreens(${t.id})">
            <div class="name">${t.name}</div>
            <div class="address">${t.address}</div>
            <div class="city">City ID: ${t.city?.id}</div>
          </div>
        `;
      });
    }

    /* SEARCH */
    function searchTheatres(){
      const value = document.getElementById("searchInput").value.toLowerCase();

      const filtered = allTheatres.filter(t =>
        t.name.toLowerCase().includes(value) ||
        t.address.toLowerCase().includes(value)
      );

      render(filtered);
    }

    /* NAV */
    function goHome(){
      window.location.href = "index.html";
    }

    /* 🔥 IMPORTANT: THEATRE → SCREENS */
    function openScreens(theatreId){
      window.location.href = `screens.html?theatreId=${theatreId}`;
    }

    fetchTheatres();

  </script>

</body>
</html>
