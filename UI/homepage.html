<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>BookMyShow</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
  rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      background:#0f1014;
      color:white;
      overflow-x:hidden;
    }

    .navbar{
      width:100%;
      height:80px;
      background:#12141b;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 60px;
      position:fixed;
      top:0;
      z-index:1000;
      border-bottom:1px solid rgba(255,255,255,0.06);
    }

    .logo{
      font-size:30px;
      font-weight:700;
      color:#f84464;
      cursor:pointer;
    }

    .search-box{
      width:260px;
      padding:12px 16px;
      border:none;
      outline:none;
      background:#1b1f29;
      color:white;
      border-radius:10px;
    }

    .btn-group{
      display:flex;
      gap:18px;
      align-items:center;
    }

    .nav-btns{
      display:flex;
      gap:10px;
      align-items:center;
    }

    .nav-btns button{
      padding:10px 14px;
      border:none;
      border-radius:10px;
      background:#1b1f29;
      color:#cfd2d9;
      font-size:13px;
      cursor:pointer;
      transition:0.2s;
      white-space:nowrap;
    }

    .nav-btns button:hover{
      background:#2a2f3d;
      color:white;
      transform:translateY(-1px);
    }

    .nav-btns .admin{
      background:#2b1b1f;
      color:#ff6b81;
    }

    .nav-btns .admin:hover{
      background:#3a2026;
    }

    .login-btn{
      padding:11px 22px;
      border:none;
      background:#f84464;
      color:white;
      border-radius:10px;
      font-weight:600;
      cursor:pointer;
    }

    .signup-btn{
      padding:11px 22px;
      border:none;
      background:#232836;
      color:white;
      border-radius:10px;
      font-weight:600;
      cursor:pointer;
    }

    .hero{
      width:100%;
      height:85vh;
      margin-top:80px;
      background:
      linear-gradient(to top,#0f1014 5%,transparent 40%),
      linear-gradient(to right, rgba(0,0,0,0.9), rgba(0,0,0,0.2)),
      url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=2070&auto=format&fit=crop')
      center/cover;

      display:flex;
      align-items:center;
      padding:0 70px;
    }

    .hero-title{
      font-size:75px;
      line-height:85px;
      max-width:800px;
    }

    .section{
      padding:50px 70px;
    }

    .movie-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
      gap:30px;
    }

    .movie-card{
      background:#171b24;
      border-radius:18px;
      overflow:hidden;
      cursor:pointer;
      border:1px solid rgba(255,255,255,0.05);
    }

    .movie-card img{
      width:100%;
      height:330px;
      object-fit:cover;
    }

    .movie-info{
      padding:18px;
    }

    footer{
      margin-top:70px;
      background:#0a0c11;
      padding:40px;
      text-align:center;
      color:#8f8f8f;
    }

    /* ONLY NEW BUTTON STYLE */
    .filter-btn{
      padding:10px 14px;
      border:none;
      border-radius:10px;
      background:#2b1b1f;
      color:#ff6b81;
      font-size:13px;
      cursor:pointer;
      transition:0.2s;
      white-space:nowrap;
    }

    .filter-btn:hover{
      background:#3a2026;
      transform:translateY(-1px);
    }

  </style>

</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">

    <div class="logo" onclick="window.location.href='index.html'">
      BookMyShow
    </div>

    <div class="btn-group">

      <div class="nav-btns">
        <button onclick="window.location.href='theatre.html'">Theatres</button>
        <button onclick="window.location.href='bookings-login.html'">My Bookings</button>
        <button class="admin" onclick="window.location.href='admin.html'">Admin</button>
      </div>

      <!-- 🔥 ONLY CHANGE: DROPDOWN REPLACED WITH BUTTON -->
      <button class="filter-btn" onclick="window.location.href='filters.html'">
        Filters
      </button>

      <input type="text"
      placeholder="Search movies..."
      class="search-box"
      id="movieSearch">

      <button class="signup-btn" onclick="openSignup()">Signup</button>
      <button class="login-btn" onclick="openLogin()">Login</button>

    </div>

  </nav>

  <!-- HERO -->
  <section class="hero">
    <h1 class="hero-title">
      Book Movie Tickets Instantly
    </h1>
  </section>

  <!-- MOVIES -->
  <section class="section">
    <h2>Trending Movies</h2>
    <div class="movie-grid" id="movieGrid"></div>
  </section>

  <footer>
    © 2026 BookMyShow Clone
  </footer>

  <script>

    const movieGrid = document.getElementById("movieGrid");
    const searchInput = document.getElementById("movieSearch");

    let allMovies = [];

    async function fetchMovies() {
      const res = await fetch("http://localhost:8080/api/movies");
      allMovies = await res.json();
      renderMovies(allMovies);
    }

    function renderMovies(movies) {

      movieGrid.innerHTML = "";

      movies.forEach(movie => {
        movieGrid.innerHTML += `
          <div class="movie-card" onclick="openMovieDetails(${movie.id})">
            <img src="${movie.posterUrl}">
            <div class="movie-info">
              <h3>${movie.title}</h3>
              <p>${movie.genre} • ${movie.language}</p>
              <p>⭐ ${movie.rating}/10</p>
            </div>
          </div>
        `;
      });
    }

    searchInput.addEventListener("input", async () => {
      const query = searchInput.value.trim();

      if (query === "") {
        fetchMovies();
        return;
      }

      const res = await fetch(`http://localhost:8080/api/movies/search?title=${query}`);
      renderMovies(await res.json());
    });

    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const query = searchInput.value.trim();
        if (query !== "") {
          window.location.href = `search.html?title=${query}`;
        }
      }
    });

    function openMovieDetails(id) {
      window.location.href = `movie-details.html?id=${id}`;
    }

    function openSignup() {
      window.location.href = "signup.html";
    }

    function openLogin() {
      window.location.href = "login.html";
    }

    fetchMovies();

  </script>

</body>
</html>
