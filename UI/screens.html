<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Screens</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>

    body{
      margin:0;
      font-family:'Poppins',sans-serif;
      background:#0f1014;
      color:white;
    }

    /* NAV */
    .navbar{
      padding:20px 40px;
      background:#12141b;
      display:flex;
      justify-content:space-between;
      align-items:center;
      position:sticky;
      top:0;
    }

    .logo{
      color:#f84464;
      font-size:24px;
      font-weight:700;
      cursor:pointer;
    }

    .container{
      padding:40px;
    }

    .title{
      font-size:28px;
      margin-bottom:20px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:20px;
    }

    .card{
      background:#171b24;
      padding:20px;
      border-radius:14px;
      cursor:pointer;
      transition:0.3s;
      border:1px solid rgba(255,255,255,0.05);
    }

    .card:hover{
      transform:translateY(-5px);
      box-shadow:0 10px 25px rgba(248,68,100,0.2);
    }

    .name{
      font-size:20px;
      font-weight:600;
    }

    .info{
      font-size:14px;
      color:#aaa;
      margin-top:6px;
    }

  </style>
</head>

<body>

  <!-- NAV -->
  <div class="navbar">
    <div class="logo" onclick="goHome()">BookMyShow</div>
  </div>

  <div class="container">
    <div class="title">Available Screens</div>
    <div class="grid" id="screenGrid"></div>
  </div>

  <script>

    const grid = document.getElementById("screenGrid");

    const theatreId = new URLSearchParams(window.location.search).get("theatreId");

    let allScreens = [];

    /* FETCH SCREENS */
    async function fetchScreens(){
      try{
        const res = await fetch(`http://localhost:8080/api/screens/theatre/${theatreId}`);
        allScreens = await res.json();
        render(allScreens);
      }catch(err){
        console.error(err);
      }
    }

    /* RENDER SCREENS */
    function render(data){

      grid.innerHTML = "";

      if(!data || data.length === 0){
        grid.innerHTML = "<p>No screens available 😢</p>";
        return;
      }

      data.forEach(screen => {

        grid.innerHTML += `
          <div class="card" onclick="openShows(${screen.id})">
            <div class="name">${screen.name}</div>
            <div class="info">Capacity: ${screen.capacity || "N/A"}</div>
          </div>
        `;
      });
    }

    /* NEXT STEP: GO TO SHOWS */
    function openShows(screenId){
      window.location.href = `shows.html?screenId=${screenId}`;
    }

    function goHome(){
      window.location.href = "index.html";
    }

    fetchScreens();

  </script>

</body>
</html>
